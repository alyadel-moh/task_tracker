server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every route falls back to index.html, letting React Router handle
    # client-side routing. Without this, a hard refresh on /dashboard or
    # /tasks/:id would 404, since nginx would look for a literal file at
    # that path instead of letting your SPA's JS decide what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
