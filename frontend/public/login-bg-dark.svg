<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d10" />
      <stop offset="50%" stop-color="#12121a" />
      <stop offset="100%" stop-color="#0d0d12" />
    </linearGradient>

    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)" />

  <circle cx="230" cy="200" r="420" fill="url(#glowIndigo)" />
  <circle cx="1400" cy="150" r="380" fill="url(#glowViolet)" />
  <circle cx="1450" cy="850" r="460" fill="url(#glowTeal)" />
  <circle cx="150" cy="820" r="340" fill="url(#glowAmber)" />

  <!-- Constellation network - scattered nodes connected by thin lines, evoking
       "connected tasks/team" without being a literal illustration of anything -->
  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="1">
    <line x1="120" y1="120" x2="300" y2="240" />
    <line x1="300" y1="240" x2="220" y2="400" />
    <line x1="300" y1="240" x2="480" y2="180" />
    <line x1="480" y1="180" x2="620" y2="320" />
    <line x1="220" y1="400" x2="90" y2="520" />
    <line x1="1280" y1="140" x2="1420" y2="220" />
    <line x1="1420" y1="220" x2="1500" y2="380" />
    <line x1="1420" y1="220" x2="1560" y2="120" />
    <line x1="1180" y1="780" x2="1320" y2="700" />
    <line x1="1320" y1="700" x2="1480" y2="800" />
    <line x1="1320" y1="700" x2="1260" y2="880" />
    <line x1="200" y1="750" x2="90" y2="880" />
    <line x1="200" y1="750" x2="340" y2="820" />
  </g>
  <g fill="#ffffff" fill-opacity="0.16">
    <circle cx="120" cy="120" r="3.5" />
    <circle cx="300" cy="240" r="4.5" />
    <circle cx="220" cy="400" r="3.5" />
    <circle cx="480" cy="180" r="3.5" />
    <circle cx="620" cy="320" r="3" />
    <circle cx="90" cy="520" r="3" />
    <circle cx="1280" cy="140" r="3.5" />
    <circle cx="1420" cy="220" r="4.5" />
    <circle cx="1500" cy="380" r="3" />
    <circle cx="1560" cy="120" r="3" />
    <circle cx="1180" cy="780" r="3.5" />
    <circle cx="1320" cy="700" r="4.5" />
    <circle cx="1480" cy="800" r="3" />
    <circle cx="1260" cy="880" r="3" />
    <circle cx="200" cy="750" r="3.5" />
    <circle cx="90" cy="880" r="3" />
    <circle cx="340" cy="820" r="3" />
  </g>

  <!-- Scattered task/kanban motifs at low opacity, kept out of the center
       where the login card sits -->
  <g opacity="0.09" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- checklist card, top-left -->
    <rect x="70" y="130" width="150" height="110" rx="14" />
    <line x1="96" y1="164" x2="194" y2="164" />
    <line x1="96" y1="190" x2="164" y2="190" />
    <line x1="96" y1="216" x2="180" y2="216" />
  </g>

  <g opacity="0.08" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- checkmark badge, bottom-left -->
    <rect x="150" y="770" width="170" height="170" rx="26" />
    <path d="M198 858 L228 888 L286 818" />
  </g>

  <g opacity="0.07" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- calendar/due-date icon, top-right -->
    <rect x="1360" y="260" width="140" height="130" rx="12" />
    <line x1="1360" y1="300" x2="1500" y2="300" />
    <line x1="1394" y1="248" x2="1394" y2="272" />
    <line x1="1466" y1="248" x2="1466" y2="272" />
  </g>

  <g opacity="0.08" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- clock/time-entry icon, bottom-right -->
    <circle cx="1400" cy="800" r="80" />
    <path d="M1400 758 L1400 800 L1432 822" />
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)" />
</svg>
